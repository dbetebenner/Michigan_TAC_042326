name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Fonts for the XeLaTeX PDFs
        # fontspec resolves \setmainfont{Noto Sans} and the Josefin Sans families
        # against SYSTEM fonts, which the runner lacks. Noto ships in Debian.
        # Josefin Sans is published upstream ONLY as a variable font, and XeTeX
        # cannot address its named instances as families — styles/tac-preamble.tex
        # asks for "Josefin Sans SemiBold" and "Josefin Sans Light" by name — so the
        # variable font is instanced into real static faces, which fontconfig matches.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra
          FONTDIR="$HOME/.local/share/fonts"; mkdir -p "$FONTDIR"
          BASE="https://github.com/google/fonts/raw/main/ofl/josefinsans"
          TMP=$(mktemp -d)
          curl -fsSL "$BASE/JosefinSans%5Bwght%5D.ttf" -o "$TMP/JosefinSans-var.ttf"
          python3 -m pip install --quiet --disable-pip-version-check fonttools brotli
          for W in 300:Light 400:Regular 500:Medium 600:SemiBold 700:Bold; do
            python3 -m fontTools.varLib.instancer --update-name-table \
              "$TMP/JosefinSans-var.ttf" "wght=${W%%:*}" \
              -o "$FONTDIR/JosefinSans-${W##*:}.ttf"
          done
          fc-cache -f
          # Noto Sans Math carries every glyph in the PDFs' math, via \setmathfont
          # in styles/tac-preamble.tex.
          #
          # Install Google's build UNCONDITIONALLY rather than trusting the distro
          # package. \setmathfont requires an OpenType MATH table; a Noto Sans Math
          # that fontconfig resolves happily but that lacks MATH makes unicode-math
          # warn and silently fall back to Latin Modern Math. The build then
          # succeeds, every font check passes, and the PDF quietly ships the wrong
          # math face — which is exactly what happened before this step existed.
          #
          # Take the STATIC Regular, not the variable NotoSansMath[wght].ttf: XeTeX
          # cannot address a variable font's instances, the same trap as Josefin above.
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/notosansmath/NotoSansMath-Regular.ttf" \
            -o "$FONTDIR/NotoSansMath-Regular.ttf"
          fc-cache -f

          # Assert the MATH table is actually there, by reading the sfnt table
          # directory. No fontTools dependency, and it fails here rather than in a
          # LaTeX warning nobody reads.
          #
          # Written as python3 -c rather than a heredoc: a heredoc body inside a
          # YAML block scalar carries this block's indentation into the script, and
          # Python rejects it.
          python3 -c 'import struct,sys; fh=open(sys.argv[1],"rb"); n=struct.unpack(">H",fh.read(6)[4:6])[0]; fh.seek(12); tags={fh.read(16)[:4].decode("latin-1").strip() for _ in range(n)}; sys.exit(0) if "MATH" in tags else (print("::error::"+sys.argv[1]+" has no OpenType MATH table; unicode-math would silently fall back to Latin Modern Math"), sys.exit(1))' \
            "$FONTDIR/NotoSansMath-Regular.ttf"
          echo "OK      Noto Sans Math has an OpenType MATH table"

          # Fail loudly here rather than inside a LaTeX log.
          #
          # Match on the EXACT family fontconfig resolves to, not on a substring.
          # `fc-match "Noto Sans Math" | grep noto` passes even when the font is
          # absent, because fontconfig falls back to some other Noto face and the
          # substring still matches — the PDF then silently renders math in the
          # wrong glyphs. Compare the resolved family to the requested one instead.
          for fam in "Noto Sans" "Noto Sans Mono" "Noto Sans Math" \
                     "Josefin Sans" "Josefin Sans Light" "Josefin Sans SemiBold"; do
            got=$(fc-match -f '%{family}' "$fam")
            # fontconfig may report a comma-separated family list; accept an exact
            # match on any member.
            if printf '%s' "$got" | tr ',' '\n' | grep -qx "$fam"; then
              echo "OK      $fam"
            else
              echo "MISSING $fam  (fontconfig resolved to: $got)"; exit 1
            fi
          done

      - name: Build the wikilink slug map
        run: Rscript scripts/build-slugmap.R

      - name: Check corpus link integrity
        run: ./scripts/check-links.sh

      - name: Check no restricted value has reappeared
        # The restricted layer is gitignored, so CI cannot see it — but it can
        # verify that none of its values have found their way back into a
        # published page. See restricted/README.md.
        run: ./scripts/check-restricted.sh

      - name: Render PDFs, then the website
        # ORDER IS LOAD-BEARING: a project render cleans output-dir, so the PDFs
        # are rendered first, stashed outside _site, and restored afterwards.
        run: |
          set -euo pipefail
          DOCS="documents/meeting-summary-2026-04.qmd documents/ai-native-tac.qmd wiki/analyses/copula-approach-to-subtest-indicators.md"
          STASH=$(mktemp -d)
          for d in $DOCS; do
            quarto render "$d" --to pdf
            pdf="${d%.*}.pdf"
            mkdir -p "$STASH/$(dirname "$pdf")"
            for cand in "$pdf" "_site/$pdf"; do
              [ -f "$cand" ] && { cp "$cand" "$STASH/$pdf"; break; }
            done
          done
          quarto render
          # Surface any font substitution XeTeX made. unicode-math warns rather
          # than errors when \setmathfont gets a font it cannot use, so the log is
          # the only place that decision is visible before the PDF is inspected.
          grep -rhiE "Font .*not found|no OpenType MATH|Missing character|falling back" \
            wiki/analyses/*.log documents/*.log 2>/dev/null | head -20 || true
          for d in $DOCS; do
            pdf="${d%.*}.pdf"
            mkdir -p "_site/$(dirname "$pdf")"
            cp "$STASH/$pdf" "_site/$pdf"
          done

      - name: Assert the build is complete
        run: |
          set -euo pipefail
          for want in _site/index.html \
                      _site/wiki/index.html \
                      _site/documents/meeting-summary-2026-04.html \
                      _site/documents/meeting-summary-2026-04.pdf \
                      _site/documents/ai-native-tac.html \
                      _site/documents/ai-native-tac.pdf \
                      _site/wiki/analyses/copula-approach-to-subtest-indicators.pdf; do
            [ -f "$want" ] || { echo "::error::missing $want"; exit 1; }
          done
          echo "corpus pages: $(find _site/wiki -name '*.html' | wc -l)"

      - name: Assert the PDFs used the right fonts
        # Installed != used. \setmathfont against a font with no OpenType MATH
        # table falls back to Latin Modern silently, and every other check passes.
        # This inspects the artifact.
        run: ./scripts/check-pdf-fonts.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
